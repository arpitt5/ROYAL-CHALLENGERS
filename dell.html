<!DOCTYPE html>
<html>
<head>
    <title>Women Digital Financial Vulnerability Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            padding: 20px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f4f6f9;
        }
        .meter {
            height: 25px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Women Financial Vulnerability Scanner</h1>

    <input type="number" id="income" placeholder="Monthly Income">

    <h3>Direct Expenses</h3>
    <input type="number" id="food" placeholder="Food">
    <input type="number" id="shopping" placeholder="Shopping">
    <input type="number" id="emi" placeholder="EMI">
    <input type="number" id="medicine" placeholder="Medicine">

    <h3>Indirect / Light Expenses</h3>
    <input type="number" id="recharge" placeholder="Recharge">
    <input type="number" id="transport" placeholder="Transport">
    <input type="number" id="others" placeholder="Other Small Expenses">

    <input type="number" id="savings" placeholder="Savings">

    <button onclick="calculateRisk()">Analyze Financial Health</button>

    <div class="result" id="output"></div>
    <canvas id="expenseChart"></canvas>
</div>

<script>
let chart;

function calculateRisk() {
    let income = parseFloat(document.getElementById("income").value) || 0;
    let food = parseFloat(document.getElementById("food").value) || 0;
    let shopping = parseFloat(document.getElementById("shopping").value) || 0;
    let emi = parseFloat(document.getElementById("emi").value) || 0;
    let medicine = parseFloat(document.getElementById("medicine").value) || 0;
    let recharge = parseFloat(document.getElementById("recharge").value) || 0;
    let transport = parseFloat(document.getElementById("transport").value) || 0;
    let others = parseFloat(document.getElementById("others").value) || 0;
    let savings = parseFloat(document.getElementById("savings").value) || 0;

    if (income <= 0) {
        alert("Enter valid income");
        return;
    }

    let totalExpenses = food + shopping + emi + medicine + recharge + transport + others;

    let score = 0;

    if (savings/income < 0.10) score += 25;
    if (emi/income > 0.40) score += 30;
    if (shopping/income > 0.35) score += 20;
    if (totalExpenses > income * 0.9) score += 25;

    let level = "";
    let color = "";

    if (score < 30) {
        level = "Low Risk";
        color = "green";
    } else if (score <= 60) {
        level = "Medium Risk";
        color = "orange";
    } else {
        level = "High Risk";
        color = "red";
    }

    let futurePlanning = "";
    let emergencyFund = income * 6;

    futurePlanning += "<li>Recommended Emergency Fund: ₹" + emergencyFund + "</li>";
    futurePlanning += "<li>Target Savings: 20% of Income</li>";
    futurePlanning += "<li>Reduce indirect expenses gradually by 10%</li>";

    document.getElementById("output").innerHTML =
        "<div class='meter' style='background:" + color + ";'></div>" +
        "<h3>Risk Score: " + score + "</h3>" +
        "<h3>Risk Level: " + level + "</h3>" +
        "<h4>Future Planning Suggestions:</h4><ul>" + futurePlanning + "</ul>";

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("expenseChart"), {
        type: 'pie',
        data: {
            labels: ["Food","Shopping","EMI","Medicine","Recharge","Transport","Others","Savings"],
            datasets: [{
                data: [food,shopping,emi,medicine,recharge,transport,others,savings],
                backgroundColor: ["#ff9999","#66b3ff","#99ff99","#ffcc99","#c2c2f0","#ffb3e6","#f7c6c7","#90ee90"]
            }]
        }
    });
}
</script>

</body>
</html>
